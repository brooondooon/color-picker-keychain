; Color Picker Keychain — Firmware
; Board: Seeed XIAO ESP32S3 Sense (built-in OV2640 or OV3660 camera)
;
; NOTE: Seeed may ship OV3660 instead of OV2640 on newer units.
; Both are compatible with esp_camera library — no code change needed.

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Enable PSRAM (needed for camera frame buffer)
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OPI
    ; TFT_eSPI config: prevent default User_Setup.h, load ours via build flags
    -DUSER_SETUP_LOADED
    -include $PROJECT_DIR/include/User_Setup.h

; Serial monitor speed
monitor_speed = 115200

; Libraries
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.0
